<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- React/Node.js Theme - Blue & Cyan -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad1)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="300" r="120" fill="#ffffff" opacity="0.1"/>
  <circle cx="950" cy="80" r="60" fill="#ffffff" opacity="0.15"/>
  
  <!-- Main Content -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">
    JOIN OUR TEAM
  </text>
  
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="28" fill="#e0f2fe" text-anchor="middle">
    React & Node.js Developers Wanted
  </text>
  
  <!-- Tech Stack Icons -->
  <g transform="translate(400, 220)">
    <!-- React Icon -->
    <circle cx="50" cy="30" r="25" fill="#ffffff" opacity="0.2"/>
    <text x="50" y="42" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">⚛</text>
    
    <!-- Node.js Icon -->
    <circle cx="150" cy="30" r="25" fill="#ffffff" opacity="0.2"/>
    <text x="150" y="42" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">🟢</text>
    
    <!-- TypeScript Icon -->
    <circle cx="250" cy="30" r="25" fill="#ffffff" opacity="0.2"/>
    <text x="250" y="42" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">TS</text>
    
    <!-- Code Icon -->
    <circle cx="350" cy="30" r="25" fill="#ffffff" opacity="0.2"/>
    <text x="350" y="42" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">💻</text>
  </g>
  
  <!-- Call to Action -->
  <rect x="450" y="300" width="300" height="60" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0ea5e9" text-anchor="middle">
    APPLY NOW
  </text>
  
  <!-- Footer text -->
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">
    Remote • Competitive Salary • Great Benefits
  </text>
</svg>
