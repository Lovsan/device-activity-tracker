<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Python Theme - Green & Yellow -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad2)"/>
  
  <!-- Decorative elements -->
  <polygon points="0,400 150,300 0,200" fill="#ffffff" opacity="0.08"/>
  <polygon points="1200,0 1050,100 1200,200" fill="#ffffff" opacity="0.08"/>
  <circle cx="250" cy="100" r="100" fill="#ffffff" opacity="0.05"/>
  <circle cx="1000" cy="320" r="90" fill="#ffffff" opacity="0.05"/>
  
  <!-- Main Content -->
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow2)">
    PYTHON DEVELOPERS
  </text>
  
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="32" fill="#d1fae5" text-anchor="middle">
    Security Research & Data Science
  </text>
  
  <!-- Python logo representation -->
  <g transform="translate(520, 200)">
    <circle cx="60" cy="30" r="35" fill="#3776ab" opacity="0.9"/>
    <circle cx="100" cy="30" r="35" fill="#ffd43b" opacity="0.9"/>
    <text x="80" y="42" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" font-weight="bold">Py</text>
  </g>
  
  <!-- Features -->
  <g transform="translate(300, 260)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">✓ Machine Learning</text>
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">✓ Data Analysis</text>
    <text x="500" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">✓ Backend Dev</text>
  </g>
  
  <!-- Call to Action -->
  <rect x="450" y="310" width="300" height="60" rx="30" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#059669" text-anchor="middle">
    JOIN US TODAY
  </text>
  
  <!-- Footer -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="16" fill="#d1fae5" text-anchor="middle">
    www.device-activity-tracker.com/careers
  </text>
</svg>
